name: audiobook_app
description: Audiobook reader with paragraph-level TTS playback.
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Audio: just_audio for playback, audio_service for MediaSession / notifications
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.27.7

  # On-device neural TTS (Piper/Kokoro ONNX) — offline synthesis, no network.
  # Run `flutter pub add sherpa_onnx` to pin the exact latest version if this
  # constraint fails to resolve. See OFFLINE_TTS_POC_PLAN.md.
  sherpa_onnx: ^1.10.0

  # Archive extraction for the downloaded on-device TTS model (tar.bz2 / tar.gz).
  archive: ^3.4.0

  # Networking
  dio: ^5.7.0

  # Connectivity — only auto-download the ~300 MB offline model on unmetered
  # (Wi-Fi/ethernet) networks.
  connectivity_plus: ^6.0.0

  # Storage
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Navigation & deep links
  go_router: ^14.2.7
  app_links: ^6.3.2

  # File selection (ebook upload)
  file_picker: ^8.1.4

  # UI
  cached_network_image: ^3.4.1

  # Widget
  home_widget: ^0.6.0

  # Utilities
  collection: ^1.18.0
  path: ^1.9.0
  audio_session: ^0.1.25
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
